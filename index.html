<title>宁德工会会员服务平台 · 原型</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;background:#f7f6f4;color:#333;line-height:1.7;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:36px 20px 64px}
h1{font-size:19px;color:#8E001E;font-weight:700}
.sub{font-size:13px;color:#999;margin:4px 0 26px}
.list{border-top:1px solid #e8e5e0}
a.item{display:block;padding:16px 4px;border-bottom:1px solid #e8e5e0;text-decoration:none;color:inherit}
a.item:hover{background:#fdf9f9}
.item .t{font-size:15px;font-weight:700;color:#8E001E}
.item .t span{font-size:11.5px;font-weight:400;color:#999;margin-left:8px}
.item p{font-size:13px;color:#777;margin-top:3px}
.note{margin-top:26px;padding:13px 16px;background:#faf7f5;border-left:3px solid #C81E2E;font-size:13px;color:#666}
.note b{color:#8E001E}
</style>
</head>
<body>
<div class="wrap">
  <h1>宁德工会会员服务平台原型</h1>
  <div class="sub">微信小程序端 + Web 管理端 &nbsp;·&nbsp; 2026-09-17</div>

  <div class="list">
    <a class="item" href="mp.html">
      <div class="t">小程序端原型<span>微信授权登录</span></div>
      <p>入会申请、爱心驿站（列表和地图）、组织架构。提交后在"我的入会申请"里看进度。</p>
    </a>
    <a class="item" href="admin.html">
      <div class="t">管理端原型<span>账号为手机号，初始密码 888888</span></div>
      <p>入会审核、组织管理（按操作手册第三章）、驿站管理（驿站列表、便民类目、驿站地图）。</p>
    </a>
  </div>

  <div class="note">
    <b>几点说明</b><br>
    1. 两个原型带查看密码，密码另行提供，同一标签页输一次就行；<br>
    2. 管理端审核、调整驿站后，小程序端刷新即可看到，数据存在浏览器本地；<br>
    3. 原型是演示数据，管理端工作台有"重置演示数据"按钮。
  </div>
</div>
</body>
