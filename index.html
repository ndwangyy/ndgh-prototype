<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宁德工会会员服务平台 · 原型</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;background:#f5f2f0;color:#333;line-height:1.7;-webkit-font-smoothing:antialiased}
.header{position:relative;background:linear-gradient(135deg,#7A101C 0%,#A61224 48%,#D8353F 100%);color:#fff;padding:38px 24px 62px;overflow:hidden}
.header::before{content:"";position:absolute;right:-70px;top:-90px;width:250px;height:250px;border-radius:50%;background:rgba(255,255,255,.06)}
.header::after{content:"";position:absolute;right:56px;bottom:-130px;width:210px;height:210px;border-radius:50%;background:rgba(255,255,255,.05)}
.header .inner{position:relative;max-width:720px;margin:0 auto;z-index:1}
.badge{display:inline-block;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.32);font-size:11.5px;padding:3px 13px;border-radius:14px;letter-spacing:2px}
.header h1{font-size:23px;font-weight:800;margin:13px 0 5px;letter-spacing:1.5px}
.header p{font-size:12.5px;opacity:.85;letter-spacing:.5px}
.wrap{max-width:720px;margin:0 auto;padding:0 20px 64px}
.list{display:flex;flex-direction:column;gap:10px;margin-top:-28px;position:relative;z-index:2}
a.item{display:block;background:#fff;border-radius:11px;padding:15px 18px 13px;text-decoration:none;color:inherit;border:1px solid #efeae7;box-shadow:0 2px 12px rgba(0,0,0,.05);transition:box-shadow .15s,transform .15s,border-color .15s}
a.item:hover{box-shadow:0 5px 18px rgba(142,0,30,.12);transform:translateY(-2px);border-color:#e8c9ce}
.item .t{display:flex;align-items:center;justify-content:space-between;gap:10px}
.item .t b{font-size:15px;color:#8E001E;font-weight:700}
.item .t span{font-size:11px;color:#a0858a;border:1px solid #e8d5d8;border-radius:10px;padding:1px 8px;white-space:nowrap}
.item p{font-size:12.8px;color:#777;margin-top:4px}
.note{margin-top:22px;background:#fdf8f7;border-left:3px solid #C81E2E;border-radius:0 8px 8px 0;padding:13px 16px;font-size:12.8px;color:#6e5f62}
.note b{color:#8E001E}
.foot{margin-top:26px;text-align:center;font-size:11.5px;color:#b3a9a6}
</style>
</head>
<body>
<div class="header">
  <div class="inner">
    <span class="badge">原型演示</span>
    <h1>宁德工会会员服务平台</h1>
    <p>微信小程序端 + Web 管理端 &nbsp;·&nbsp; 2026-09-17</p>
  </div>
</div>
<div class="wrap">
  <div class="list">
    <a class="item" href="mp.html">
      <div class="t"><b>小程序端原型</b><span>微信授权登录</span></div>
      <p>入会申请、爱心驿站（列表和地图）、组织架构。提交后在"我的入会申请"里看进度。</p>
    </a>
    <a class="item" href="admin.html">
      <div class="t"><b>管理端原型</b><span>账号为手机号 · 初始密码 888888</span></div>
      <p>入会审核、组织管理（按操作手册第三章）、驿站管理（驿站列表、便民类目、驿站地图）。</p>
    </a>
  </div>

  <div class="note">
    <b>几点说明</b><br>
    1. 两个原型带查看密码，密码另行提供，同一标签页输一次就行；<br>
    2. 管理端审核、调整驿站后，小程序端刷新即可看到，数据存在浏览器本地；<br>
    3. 原型是演示数据，管理端工作台有"重置演示数据"按钮。
  </div>

  <div class="foot">宁德电信</div>
</div>
</body>
</html>
